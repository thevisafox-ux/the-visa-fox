<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Form detection</title></head>
  <body>
    <form name="profile-assessment" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="profile-assessment">
      <input name="bot-field">
      <input name="name">
      <input name="phone">
      <input name="email">
      <input name="preferredCountry">
      <input name="visaType">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
